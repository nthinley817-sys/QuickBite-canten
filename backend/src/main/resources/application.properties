spring.application.name=quickbite-backend
server.port=8080

# --- MySQL ---------------------------------------------------------------
# Override with real env vars in prod; these defaults target a local MySQL
# instance with a root user and no password, and auto-create the schema.
spring.datasource.url=jdbc:mysql://localhost:3306/quickbite?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate -------------------------------------------------------
# ddl-auto=update creates/adjusts tables automatically from the entities —
# fine for this prototype; switch to a migration tool (Flyway/Liquibase)
# before this is a production system with data you can't afford to lose.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
