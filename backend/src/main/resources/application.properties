spring.application.name=quickbite-backend
server.port=8080

# --- PostgreSQL ------------------------------------------------------------
# Override DB_URL/DB_USERNAME/DB_PASSWORD with real env vars in prod (e.g.
# Render's managed Postgres); these defaults target a local Postgres
# instance with a "quickbite" database already created.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quickbite}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate -------------------------------------------------------
# ddl-auto=update creates/adjusts tables automatically from the entities —
# fine for this prototype; switch to a migration tool (Flyway/Liquibase)
# before this is a production system with data you can't afford to lose.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
